<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="storia-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a" />
      <stop offset="1" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="storia-book" x1="10" y1="36" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284c7" />
      <stop offset="1" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="storia-saffron" x1="26" y1="8" x2="38" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fde047" />
      <stop offset="1" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#storia-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Magic swirls -->
  <path d="M22 26c-5-6-2-14 5-15s10 4 8 10c-1 3-3 5-3 5" stroke="#a855f7" stroke-width="3.2" stroke-linecap="round" />
  <path d="M42 28c4-5 8-4 9 1s-4 9-9 8" stroke="#f43f5e" stroke-width="2.8" stroke-linecap="round" />
  <path d="M17 38c-4-4-6-10-1-13s9 3 7 7" stroke="#06b6d4" stroke-width="2.8" stroke-linecap="round" />
  <path d="M45 36c4 3 7 7 6 11s-7 4-10 1" stroke="#10b981" stroke-width="2.8" stroke-linecap="round" />

  <!-- Floating Ascending Letters -->
  <text x="32" y="9" fill="#facc15" font-size="6" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle">A</text>
  <text x="42" y="12" fill="#10b981" font-size="5.5" font-family="system-ui, sans-serif" font-weight="800">B</text>
  <text x="50" y="18" fill="#facc15" font-size="5.5" font-family="system-ui, sans-serif" font-weight="800">C</text>
  <text x="14" y="24" fill="#ffffff" font-size="5" font-family="system-ui, sans-serif" font-weight="700">e</text>
  <text x="52" y="27" fill="#ffffff" font-size="5" font-family="system-ui, sans-serif" font-weight="700">k</text>

  <!-- Golden Saffron "S" Swirl Centerpiece -->
  <path d="M36 17.5c-1.5-2.2-4.5-2.5-6.5-1-2 1.5-2 4 0 5.5 3 2.2 4.5 3.5 4.5 6.5 0 3.5-3 5.5-6.5 5-2.5-.4-4-2-4.5-3.5"
    stroke="url(#storia-saffron)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Open Storybook Base -->
  <path d="M11 40c6.5-2 14-2.5 21 1.5 7-4 14.5-3.5 21-1.5v15c-6.5-2-14-1.5-21 2-7-3.5-14.5-4-21-2v-15z"
    fill="url(#storia-book)" stroke="#0c4a6e" stroke-width="1.5" />
  <path d="M32 41.5v17" stroke="#0369a1" stroke-width="2" stroke-linecap="round" />

  <!-- Page Text / Audio Waves -->
  <path d="M16 45c3.5-1 8-1 12 1M16 48.5c3.5-1 8-1 12 1M16 52c3-1 6.5-1 10 0.8" stroke="#e0f2fe" stroke-width="1.6" stroke-linecap="round" />
  <path d="M36 46c4-1 8.5-1 12 0.8M36 49.5c4-1 8.5-1 12 0.8M36 53c3-0.8 6.5-0.8 10 0.8" stroke="#e0f2fe" stroke-width="1.6" stroke-linecap="round" />

  <!-- Bottom Accent Swirls -->
  <path d="M11 48c-3 2-3 7 1 7s5-2 5-5" stroke="#f43f5e" stroke-width="2.4" stroke-linecap="round" fill="none" />
  <path d="M53 49c3 1 4 6 1 8s-6 1-7-3" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" fill="none" />
</svg>

